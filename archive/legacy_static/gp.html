<body data-page="gp">
<header class="topbar"><div class="topbar-in">
  <div class="brand">
    <img class="logo" src="/static/emblem.png" alt="Government of Karnataka emblem" width="400" height="345">
    <div><h1 data-i18n="gp_title">GP Report Card</h1><small class="gov-line" data-i18n="gov">Government of Karnataka</small><small data-i18n="gp_sub"></small></div>
  </div>
  <nav class="nav" id="nav" data-active="gp"></nav>
</div></header>
<main class="wrap">
  <div class="filters noprint">
    <label class="grow searchbox"><span data-i18n="gp_search"></span>
      <input id="search" type="search" autocomplete="off" maxlength="60" placeholder="e.g. Jummanakatti">
      <div id="results" class="results" hidden></div></label>
    <label><span data-i18n="fy">Financial year</span> <select id="fy"></select></label>
    <button id="print" type="button" class="btn" data-i18n="gp_print" hidden></button>
    <button id="csv" type="button" class="btn ghost" data-i18n="gp_csv" hidden></button>
  </div>
  <div id="empty" class="card muted" data-i18n="gp_pick"></div>
  <div id="card" hidden></div>
</main>
